summary: Smoke test for the pi-coding-agent snap
details: |
    This test verifies that the pi-coding-agent snap is properly installed,
    launches without crashing, and prints help output.
    Tests both the default app (pi-coding-agent) and the pi alias target.

execute: |
    # Verify the snap is installed.
    snap list | MATCH "pi-coding-agent"

    # Test the default app (pi-coding-agent).
    snap run pi-coding-agent --help 2>&1 | MATCH "pi"
    snap run pi-coding-agent --version 2>&1 | MATCH "1.1.0"

    # Test the pi alias target (pi-coding-agent.pi).
    snap run pi-coding-agent.pi --help 2>&1 | MATCH "pi"
    snap run pi-coding-agent.pi --version 2>&1 | MATCH "1.1.0"

    # pi.wrapper arms an AppArmor onexec transition so node and anything it
    # spawns do not inherit the snap's complain-mode label, which otherwise
    # breaks output redirection of snaps launched by pi (fixes
    # https://github.com/canonical/pi-coding-agent-snap/issues/26). A
    # NODE_OPTIONS preload reports the labels of node and of a child, then
    # exits before pi starts.
    cat > /tmp/pi-label.js <<'EOF'
    const fs = require("fs");
    const cp = require("child_process");
    const f = fs.existsSync("/proc/self/attr/apparmor/current")
      ? "/proc/self/attr/apparmor/current" : "/proc/self/attr/current";
    console.log("node: " + fs.readFileSync(f, "utf8").replace(/\0/g, "").trim());
    console.log("child: " + cp.execFileSync("cat", [f]).toString().replace(/\0/g, "").trim());
    process.exit(0);
    EOF
    NODE_OPTIONS=--require=/tmp/pi-label.js snap run pi-coding-agent.pi > pi-labels.txt
    cat pi-labels.txt
    MATCH '^node: unconfined$' < pi-labels.txt
    MATCH '^child: unconfined$' < pi-labels.txt
    rm -f /tmp/pi-label.js pi-labels.txt

    # Verify the new Node.js-runtime layout (fixes
    # https://github.com/canonical/pi-coding-agent-snap/issues/13: the
    # previous Bun-compiled binary hardcoded a 5-minute socket timeout).
    /snap/pi-coding-agent/current/node/bin/node --version 2>&1 | MATCH "v22"
    test -e /snap/pi-coding-agent/current/lib/pi/packages/coding-agent/dist/cli.js
    test ! -e /snap/pi-coding-agent/current/bin/pi

    # License texts for the redistributed upstream code must ship.
    test -e /snap/pi-coding-agent/current/node/LICENSE
    test -e /snap/pi-coding-agent/current/lib/pi/LICENSE

    # X11 clipboard image-paste is a native prebuild bundled inside
    # @earendil-works/pi-tui (pi 0.86 replaced the former
    # @mariozechner/clipboard-linux-*-gnu optional dependency with this);
    # it is loaded relative to the installed package directory, never
    # from dist/, so the snap's assembly step must stage it explicitly.
    # Verify it shipped for the arch under test rather than assuming the
    # per-package dist/package.json/README.md copy covered it. riscv64
    # ships no prebuild (pi falls back to wl-clipboard), so there the
    # check inverts: the native subtree must be absent.
    case "$(uname -m)" in
        x86_64)
            _TUI_NATIVE_ARCH=x64
            ;;
        aarch64)
            _TUI_NATIVE_ARCH=arm64
            ;;
        riscv64)
            _TUI_NATIVE_ARCH=
            ;;
    esac
    if [ -n "$_TUI_NATIVE_ARCH" ]; then
        test -e "/snap/pi-coding-agent/current/lib/pi/packages/tui/native/linux/prebuilds/linux-${_TUI_NATIVE_ARCH}/linux-platform-x11.node"
    else
        test ! -e /snap/pi-coding-agent/current/lib/pi/packages/tui/native
    fi

    # The staged wl-clipboard tools must actually start: their ELF
    # interpreter has to exist inside core26 (amd64 keeps it in lib64,
    # arm64/riscv64 in lib — a wrong path fails at exec with ENOENT,
    # which is how the arm64 stable snap shipped broken wl-copy).
    # pi.wrapper puts $SNAP/usr/bin on PATH so pi finds these, not any
    # host-installed copy.
    /snap/pi-coding-agent/current/usr/bin/wl-copy --help > /dev/null
    /snap/pi-coding-agent/current/usr/bin/wl-paste --help > /dev/null

    # Unused build artifacts are stripped from the payload: no source maps
    # or type declarations anywhere under lib/pi, and no bundled CLI
    # duplicate (pi.wrapper execs dist/cli.js directly).
    test -z "$(find /snap/pi-coding-agent/current/lib/pi \( -name '*.map' -o -name '*.d.ts' -o -name '*.d.mts' -o -name '*.d.cts' \) -print -quit)"
    test ! -e \
        /snap/pi-coding-agent/current/lib/pi/packages/coding-agent/dist/bundle

    # Every npm workspace symlink must resolve inside the payload. The
    # workspace package set is derived from compiled imports and production
    # dependencies (snap/local/pi-workspace-packages.mjs). Check the whole
    # payload because npm also nests workspace links under per-package
    # node_modules/.
    test -z "$(find /snap/pi-coding-agent/current/lib/pi -type l \
        ! -exec test -e {} \; -print -quit)"

    # Check every declared production dependency from the directory of the
    # package that declares it, as Node will at runtime. import.meta.resolve
    # handles ESM-only exports; createRequire covers require-only exports.
    # Verify the resolved file actually exists (ESM resolution alone need
    # not check that) and stays inside the snap, including nested deps.
    # Checking workspace links alone missed chord and telemetry in 1.1.0;
    # checking only root node_modules missed pi-ai's nested openai in 0.99.
    PI=/snap/pi-coding-agent/current/lib/pi
    NODE=/snap/pi-coding-agent/current/node/bin/node
    for pkg in "$PI"/packages/*; do
        (cd "$pkg" && "$NODE" --input-type=module -e '
          import fs from "node:fs";
          import path from "node:path";
          import { createRequire } from "node:module";
          import { fileURLToPath } from "node:url";
          const root = fs.realpathSync(path.resolve("../.."));
          const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const require = createRequire(import.meta.url);
          let bad = false;
          for (const dep of Object.keys(manifest.dependencies || {})) {
            let resolved;
            try {
              const url = import.meta.resolve(dep);
              resolved = url.startsWith("file:") ? fileURLToPath(url) : url;
            } catch {
              try { resolved = require.resolve(dep); } catch { /* reported below */ }
            }
            if (!resolved || !path.isAbsolute(resolved) || !fs.existsSync(resolved) ||
                !fs.realpathSync(resolved).startsWith(root + path.sep)) {
              console.error(manifest.name + ": missing or external production dependency " + dep +
                (resolved ? " (" + resolved + ")" : ""));
              bad = true;
            }
          }
          process.exit(bad ? 1 : 0);
        ') || exit 1
    done
    unset PI NODE

    # The subagent async runner needs this exported subpath, not just
    # chord's package root. This is an import check, not a model/API test.
    (cd /snap/pi-coding-agent/current/lib/pi/packages/coding-agent && \
      /snap/pi-coding-agent/current/node/bin/node --input-type=module -e \
      'await import("@earendil-works/chord/context")')
